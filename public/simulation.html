  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Outfit', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          animation: {
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'bounce-subtle': 'bounceSubtle 2s infinite',
            'radar-sweep': 'radarSweep 4s linear infinite',
            'siren': 'sirenFlash 0.8s ease-in-out infinite',
          },
          keyframes: {
            bounceSubtle: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-4px)' },
            },
            radarSweep: {
              '0%': { transform: 'rotate(0deg)' },
              '100%': { transform: 'rotate(360deg)' },
            },
            sirenFlash: {
              '0%, 100%': { backgroundColor: 'rgba(239, 68, 68, 0.2)', borderColor: 'rgba(239, 68, 68, 0.8)' },
              '50%': { backgroundColor: 'rgba(59, 130, 246, 0.2)', borderColor: 'rgba(59, 130, 246, 0.8)' },
            }
          }
        }
      }
    }
  </script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

    ::-webkit-scrollbar { width: 6px; height: 6px; }

      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(226, 232, 240, 0.8);
    }
    .glass-dark {
      background: rgba(15, 23, 42, 0.9);

</head>
<body class="bg-gradient-to-br from-slate-900 via-[#0B1528] to-slate-950 text-slate-100 min-h-screen font-sans flex flex-col antialiased selection:bg-sky-500 selection:text-white">

  <!-- 1. TOP HEADER & NAVIGATION BAR -->
  <!-- ============================================================================ -->

    <div class="flex items-center space-x-3">
      <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-sky-500 via-teal-400 to-indigo-600 flex items-center justify-center font-black text-sm text-white shadow-md shadow-sky-500/20">
        W
      </div>
      <div>
        <div class="flex items-center space-x-2">
          <span class="font-display font-extrabold text-base tracking-tight text-white">WeatherGPT</span>
          <span class="px-2 py-0.5 rounded-md text-[10px] font-black uppercase tracking-wider bg-amber-500/20 text-amber-400 border border-amber-500/40 animate-pulse">
            SIMULATION MODE
          </span>
        </div>
        <p class="text-[11px] text-slate-400 font-medium hidden sm:block">Chengalpattu ➔ Chennai Central (18-Module Interactive Demo)</p>
      </div>
    </div>

    <div class="flex items-center space-x-2">
      <!-- Sound Mute / Unmute Toggle -->
      <button id="soundToggleBtn" onclick="toggleSound()" class="p-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700 text-xs flex items-center space-x-1.5 transition-all cursor-pointer" title="Toggle Simulation Sounds">
        <i data-lucide="volume-2" class="w-4 h-4 text-sky-400"></i>
        <span class="text-[11px] font-bold hidden md:inline" id="soundStatusText">Sound ON</span>
      </button>

      <!-- Language Selector in Simulation -->
      <select id="simLanguageSelect" onchange="changeLanguage(this.value)" class="bg-slate-800 border border-slate-700 text-slate-200 text-xs font-bold rounded-xl px-2.5 py-1.5 focus:outline-none focus:border-sky-500 cursor-pointer">
        <option value="en">English</option>
        <option value="ta">தமிழ் (Tamil)</option>
        <option value="hi">हिंदी (Hindi)</option>
      </select>

      <!-- Back to Real Chatbot Button -->
      <a href="/" class="px-3 py-1.5 rounded-xl bg-sky-600 hover:bg-sky-500 text-white text-xs font-bold flex items-center space-x-1.5 transition-all shadow-md shadow-sky-600/30 cursor-pointer">
        <i data-lucide="message-square" class="w-3.5 h-3.5"></i>
        <span>Live Chatbot</span>
      </a>
    </div>
  </header>

  <!-- 2. SIMULATION CONTROLLER & PROGRESS BAR -->

      <!-- Progress Bar & Step Counter -->

        <div class="flex items-center space-x-2">
          <span class="px-2 py-0.5 rounded-md bg-sky-500/20 text-sky-400 font-bold border border-sky-500/30" id="moduleBadge">
            Module 1 / 18
          </span>
          <span class="text-slate-300 font-sans font-bold text-xs sm:text-sm truncate max-w-[200px] sm:max-w-md" id="moduleTitle">
            Location Detection & Geofence Baseline
          </span>
        </div>
        <span class="text-slate-400 font-bold text-[11px]" id="progressPercent">5% Completed</span>
      </div>

      <!-- Progress Fill Track -->
      <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden p-0.5 border border-slate-700/60">
        <div id="progressBarFill" class="bg-gradient-to-r from-sky-500 via-teal-400 to-emerald-400 h-full rounded-full transition-all duration-300" style="width: 5.5%;"></div>
      </div>

      <!-- Playback Controls -->
      <div class="flex items-center justify-between flex-wrap gap-2 pt-1">
        <div class="flex items-center space-x-1.5">
          <!-- Play / Pause -->
          <button id="playPauseBtn" onclick="togglePlayPause()" class="px-3 py-1.5 rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-bold text-xs flex items-center space-x-1.5 transition-all shadow-sm cursor-pointer active:scale-95">
            <i data-lucide="pause" id="playPauseIcon" class="w-3.5 h-3.5"></i>
            <span id="playPauseText">Pause</span>
          </button>

          <!-- Speed Multiplier 1x / 2x / 4x -->
          <button id="speedBtn" onclick="cycleSpeed()" class="px-2.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-amber-400 font-bold text-xs border border-slate-700 flex items-center space-x-1 transition-all cursor-pointer">
            <i data-lucide="zap" class="w-3.5 h-3.5"></i>
            <span id="speedText">1× Speed</span>
          </button>

          <!-- Previous Module -->
          <button onclick="previousModule()" class="p-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition-all cursor-pointer" title="Previous Module">
            <i data-lucide="skip-back" class="w-4 h-4"></i>
          </button>

          <!-- Next / Skip Module -->
          <button onclick="nextModule()" class="px-2.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 font-bold text-xs flex items-center space-x-1 transition-all cursor-pointer" title="Next Module">
            <span>Skip</span>
            <i data-lucide="skip-forward" class="w-3.5 h-3.5"></i>
          </button>

          <!-- Restart -->
          <button onclick="restartSimulation()" class="p-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition-all cursor-pointer" title="Restart to Module 1">
            <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
          </button>
        </div>

        <div class="flex items-center space-x-2">
          <!-- Module Quick Jumper Menu -->
          <button onclick="toggleModuleDrawer()" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-bold text-xs flex items-center space-x-1.5 transition-all cursor-pointer">
            <i data-lucide="list" class="w-3.5 h-3.5 text-sky-400"></i>
            <span>All 18 Modules</span>
          </button>
        </div>

      '6. 7-Day Extended Trend Forecast',

      '8. Severe Weather Hazard Warning',

    // ============================================================================
    // SYNTHESIZED WEB AUDIO SIREN & CHIME
    // ============================================================================
    let audioCtx = null;
    let sirenInterval = null;

    function getAudioContext() {
      if (!audioCtx && typeof window !== 'undefined') {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playSynthesizedChime() {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, now); // D5
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.15); // A5
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.4);
      } catch (e) {}
    }

    function startSirenAlarm() {
      if (!soundEnabled) return;
      stopSirenAlarm();
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        let highTone = true;
        sirenInterval = setInterval(() => {
          if (!soundEnabled) return;
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(highTone ? 987.77 : 659.25, now); // B5 vs E5
          highTone = !highTone;
          gain.gain.setValueAtTime(0.35, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.35);
        }, 380);
      } catch (e) {}
    }

    function stopSirenAlarm() {
      if (sirenInterval) {
        clearInterval(sirenInterval);
        sirenInterval = null;
      }
    }

    function speakSimulationText(text, lang = 'en') {
      if (!soundEnabled || !('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1.0;
        utterance.pitch = 1.05;
        if (lang === 'ta') utterance.lang = 'ta-IN';
        else if (lang === 'hi') utterance.lang = 'hi-IN';
        else utterance.lang = 'en-US';
        window.speechSynthesis.speak(utterance);
      } catch (e) {}
    }

    // PLAYBACK CONTROLS

    function updateProgressUI() {
      const pct = Math.round((currentModuleIndex / TOTAL_MODULES) * 100);

      document.getElementById('moduleTitle').innerText = MODULE_NAMES[currentModuleIndex - 1];
      document.getElementById('progressPercent').innerText = `${pct}% Completed`;
      document.getElementById('progressBarFill').style.width = `${pct}%`;

    function togglePlayPause() {
      isPaused = !isPaused;
      document.getElementById('playPauseIcon').setAttribute('data-lucide', isPaused ? 'play' : 'pause');
      document.getElementById('playPauseText').innerText = isPaused ? 'Resume' : 'Pause';
      lucide.createIcons();
      if (!isPaused) {
        scheduleNextStep();
      } else {
        clearTimeout(stepTimer);
      }
    }

    function cycleSpeed() {
      if (playbackSpeed === 1) playbackSpeed = 2;
      else if (playbackSpeed === 2) playbackSpeed = 4;
      else playbackSpeed = 1;
      document.getElementById('speedText').innerText = `${playbackSpeed}× Speed`;
      if (!isPaused) {
        clearTimeout(stepTimer);
        scheduleNextStep();
      }
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('soundStatusText').innerText = soundEnabled ? 'Sound ON' : 'Muted';
      const icon = document.querySelector('#soundToggleBtn i');
      if (icon) icon.setAttribute('data-lucide', soundEnabled ? 'volume-2' : 'volume-x');
      lucide.createIcons();
      if (!soundEnabled) {
        stopSirenAlarm();
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      }
    }

    function changeLanguage(lang) {
      currentLang = lang;
      renderCurrentModule();
    }

    function nextModule() {
      clearTimeout(stepTimer);
      stopSirenAlarm();
      if (currentModuleIndex < TOTAL_MODULES) {
        currentModuleIndex++;
      } else {
        currentModuleIndex = 1;
      }
      playSynthesizedChime();
      renderCurrentModule();
      if (!isPaused) scheduleNextStep();
    }

    function previousModule() {
      clearTimeout(stepTimer);
      stopSirenAlarm();
      if (currentModuleIndex > 1) {
        currentModuleIndex--;
      } else {
        currentModuleIndex = TOTAL_MODULES;
      }
      playSynthesizedChime();
      renderCurrentModule();
      if (!isPaused) scheduleNextStep();
    }

    function jumpToModule(idx) {
      clearTimeout(stepTimer);
      stopSirenAlarm();
      currentModuleIndex = idx;
      playSynthesizedChime();
      toggleModuleDrawer();
      renderCurrentModule();
      if (!isPaused) scheduleNextStep();
    }

    function restartSimulation() {
      clearTimeout(stepTimer);
      stopSirenAlarm();
      currentModuleIndex = 1;
      playSynthesizedChime();
      renderCurrentModule();
      if (!isPaused) scheduleNextStep();
    }

    function toggleModuleDrawer() {
      const modal = document.getElementById('moduleDrawerModal');
      modal.classList.toggle('hidden');
      if (!modal.classList.contains('hidden')) {

      }
    }

    function renderDrawerList() {
      const container = document.getElementById('drawerModulesList');
      container.innerHTML = MODULE_NAMES.map((name, i) => `

          <span class="truncate">${name}</span>
          <span class="text-[10px] font-mono px-1.5 py-0.5 rounded ${currentModuleIndex === i + 1 ? 'bg-sky-500 text-white' : 'bg-slate-700 text-slate-400'}">#${i + 1}</span>
        </button>
      `).join('');
    }

    function scheduleNextStep() {
      clearTimeout(stepTimer);
      if (isPaused) return;

      // Base durations per module (scaled by playbackSpeed)
      const baseDurationMs = (currentModuleIndex === 3 || currentModuleIndex === 4 || currentModuleIndex === 7 || currentModuleIndex === 17 || currentModuleIndex === 18) ? 7500 : 5000;
      const effectiveDuration = Math.max(1200, Math.round(baseDurationMs / playbackSpeed));

      stepTimer = setTimeout(() => {
        if (!isPaused) {
          if (currentModuleIndex < TOTAL_MODULES) {
            nextModule();
          } else {
            // Loop or finish
            currentModuleIndex = 1;
            renderCurrentModule();
            scheduleNextStep();
          }
        }
      }, effectiveDuration);
    }

                <i data-lucide="navigation" class="w-5 h-5"></i>
              </span>
              <div>
                <h2 class="font-display font-black text-xl text-white">Module 17: Smart Destination Alarm (GPS Travel)</h2>
                <p class="text-xs text-slate-400">Chengalpattu ➔ Chennai Central (Continuous Telemetry)</p>
              </div>
            </div>
            <span class="px-2.5 py-1 rounded-full bg-amber-500/20 text-amber-400 text-xs font-mono font-bold border border-amber-500/30">
              GEOFENCE: 100M
            </span>
          </div>

          <!-- 7 Stages Progress Visualizer -->
          <div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-7 gap-2 text-center text-xs">
            ${SIMULATION_DATA.smartAlarmJourney.map((st, i) => `
              <div class="p-3 rounded-2xl ${i === 6 ? 'bg-emerald-500/20 border-emerald-400' : 'bg-slate-800/60 border-slate-700'} border space-y-1">
                <span class="text-[10px] font-mono text-slate-400 block">Stage ${st.stage}</span>
                <span class="text-base font-black text-white block">${st.distance}</span>
                <span class="text-[10px] text-sky-400 block">ETA: ${st.eta}</span>
                <span class="text-[9px] text-slate-300 truncate block">${st.status}</span>
              </div>
            `).join('')}
          </div>

          <div class="p-4 rounded-2xl bg-sky-950/40 border border-sky-500/40 text-xs flex items-center justify-between">
            <div class="flex items-center space-x-2">
              <i data-lucide="bell" class="w-4 h-4 text-sky-400"></i>
              <span>Destination Weather: <strong>Chennai Central: 30°C, 70% Rain</strong> — Keep umbrella ready.</span>
            </div>
            <span class="text-emerald-400 font-mono font-bold">Progress: 100m approaching</span>
          </div>
        </div>
      `;
    }

    // --- MODULE 18: DESTINATION REACHED & ALARM TRIGGER ---
    function renderModule18_DestinationReached(canvas) {
      canvas.innerHTML = `
        <div class="glass-dark rounded-3xl p-6 border-4 border-rose-500/80 shadow-2xl shadow-rose-900/40 space-y-6 text-center animate-fadeIn">
          <div class="w-24 h-24 mx-auto rounded-full bg-rose-600/30 border-4 border-rose-500 flex items-center justify-center text-rose-400 shadow-2xl shadow-rose-600/50 animate-bounce">
            <i data-lucide="bell-ring" class="w-12 h-12 animate-spin"></i>
          </div>

          <div class="space-y-2">
            <span class="px-3 py-1 rounded-full bg-rose-500/20 text-rose-400 font-mono font-black text-xs uppercase tracking-widest border border-rose-500/40">
              🎯 100m Geofence Alarm Triggered
            </span>
            <h2 class="font-display font-black text-2xl sm:text-3xl text-white">
              YOU HAVE REACHED YOUR DESTINATION
            </h2>
            <p class="text-base font-bold text-slate-200">
              Chennai Central, Tamil Nadu, India
            </p>
          </div>

          <div class="p-4 rounded-2xl bg-rose-950/40 border border-rose-500/40 max-w-md mx-auto space-y-2">
            <div class="flex items-center justify-center space-x-2 text-rose-300 font-bold text-sm">
              <i data-lucide="volume-2" class="w-5 h-5"></i>
              <span>🔊 Voice Alert Speaking:</span>
            </div>
            <p class="text-xs sm:text-sm text-slate-100 font-medium">
              "You have reached your destination. Please get ready to get down."
            </p>
          </div>

          <div class="flex items-center justify-center space-x-3 pt-2">
            <button onclick="stopSirenAlarm()" class="px-6 py-3 rounded-2xl bg-rose-600 hover:bg-rose-500 text-white font-black text-sm shadow-xl shadow-rose-600/40 cursor-pointer active:scale-95 transition-all">
              🛑 Stop Alarm
            </button>
            <button onclick="restartSimulation()" class="px-5 py-3 rounded-2xl bg-slate-800 hover:bg-slate-700 text-white font-bold text-xs border border-slate-700 cursor-pointer">
              🔄 Restart Demo
            </button>
          </div>
        </div>
      `;
      // Trigger Siren Alarm & Spoken Voice
      startSirenAlarm();
      speakSimulationText("You have reached your destination. Please get ready to get down.");
    }

    // ============================================================================
    // INITIALIZATION ON LOAD
    // ============================================================================
    window.addEventListener('DOMContentLoaded', () => {
      renderCurrentModule();
      scheduleNextStep();
    });
  </script>
</body>
</html>
