<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WeatherGPT — 18-Module Interactive Simulation Mode</title>
  <link rel="icon" type="image/png" href="/wyndra-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700;800;900&family=Noto+Sans+Devanagari:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Noto Sans Tamil', 'Noto Sans Devanagari', 'sans-serif'],
            display: ['Outfit', 'Noto Sans Tamil', 'Noto Sans Devanagari', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          animation: {
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'bounce-subtle': 'bounceSubtle 2s infinite',
            'radar-sweep': 'radarSweep 4s linear infinite',
            'siren': 'sirenFlash 0.8s ease-in-out infinite',
            'fadeIn': 'fadeIn 0.3s ease-out forwards',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(6px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            bounceSubtle: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-4px)' },
            },
            radarSweep: {
              '0%': { transform: 'rotate(0deg)' },
              '100%': { transform: 'rotate(360deg)' },
            },
            sirenFlash: {
              '0%, 100%': { backgroundColor: 'rgba(239, 68, 68, 0.25)', borderColor: 'rgba(239, 68, 68, 0.9)' },
              '50%': { backgroundColor: 'rgba(59, 130, 246, 0.25)', borderColor: 'rgba(59, 130, 246, 0.9)' },
            }
          }
        }
      }
    }
  </script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(241, 245, 249, 0.05); }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.4); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 0.7); }
    .glass-dark {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(51, 65, 85, 0.6);
    }
    .radar-grid {
      background-size: 24px 24px;
      background-image: 
        linear-gradient(to right, rgba(56, 189, 248, 0.1) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(56, 189, 248, 0.1) 1px, transparent 1px);
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-[#0B1528] to-slate-950 text-slate-100 min-h-screen font-sans flex flex-col antialiased selection:bg-sky-500 selection:text-white">

  <!-- ============================================================================ -->
  <!-- 1. TOP HEADER NAVIGATION -->
  <!-- ============================================================================ -->
  <header class="w-full border-b border-slate-800/80 bg-slate-900/90 backdrop-blur-xl px-4 py-3 flex items-center justify-between z-40 sticky top-0 shadow-lg shadow-black/20">
    <div class="flex items-center space-x-3">
      <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-sky-500 via-teal-400 to-indigo-600 flex items-center justify-center font-black text-sm text-white shadow-md shadow-sky-500/20">
        W
      </div>
      <div>
        <div class="flex items-center space-x-2">
          <span class="font-display font-extrabold text-base tracking-tight text-white">WeatherGPT</span>
          <span id="headerSimBadge" class="px-2 py-0.5 rounded-md text-[10px] font-black uppercase tracking-wider bg-amber-500/20 text-amber-400 border border-amber-500/40 animate-pulse">
            SIMULATION MODE
          </span>
        </div>
        <p id="headerSubtitle" class="text-[11px] text-slate-400 font-medium hidden sm:block">Chengalpattu ➔ Chennai Central (18-Module Interactive Demo)</p>
      </div>
    </div>

    <div class="flex items-center space-x-2">
      <!-- Sound Mute / Unmute Toggle -->
      <button id="soundToggleBtn" onclick="toggleSound()" class="p-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700 text-xs flex items-center space-x-1.5 transition-all cursor-pointer" title="Toggle Simulation Sounds">
        <i data-lucide="volume-2" id="soundIcon" class="w-4 h-4 text-sky-400"></i>
        <span class="text-[11px] font-bold hidden md:inline" id="soundStatusText">Sound ON</span>
      </button>

      <!-- 3-Language Selector in Simulation -->
      <div class="relative flex items-center">
        <select id="simLanguageSelect" onchange="changeLanguage(this.value)" class="bg-slate-800 border-2 border-sky-500/70 text-white text-xs font-black rounded-xl px-3 py-1.5 focus:outline-none focus:border-sky-400 cursor-pointer shadow-md shadow-sky-900/40">
          <option value="en">🇬🇧 English</option>
          <option value="ta">🇮🇳 தமிழ் (Tamil)</option>
          <option value="hi">🇮🇳 हिंदी (Hindi)</option>
        </select>
      </div>

      <!-- Back to Real Chatbot Button -->
      <a href="/" class="px-3 py-1.5 rounded-xl bg-sky-600 hover:bg-sky-500 text-white text-xs font-bold flex items-center space-x-1.5 transition-all shadow-md shadow-sky-600/30 cursor-pointer">
        <i data-lucide="message-square" class="w-3.5 h-3.5"></i>
        <span id="liveChatbotBtnText">Live Chatbot</span>
      </a>
    </div>
  </header>

  <!-- ============================================================================ -->
  <!-- 2. SIMULATION CONTROLLER & PROGRESS BAR -->
  <!-- ============================================================================ -->
  <div class="w-full bg-slate-900/95 border-b border-slate-800 px-4 py-2.5 z-30 shadow-md">
    <div class="max-w-5xl mx-auto space-y-2">
      <!-- Progress Bar & Step Counter -->
      <div class="flex items-center justify-between text-xs font-mono">
        <div class="flex items-center space-x-2">
          <span class="px-2 py-0.5 rounded-md bg-sky-500/20 text-sky-400 font-bold border border-sky-500/30" id="moduleBadge">
            Module 1 / 18
          </span>
          <span class="text-slate-200 font-sans font-bold text-xs sm:text-sm truncate max-w-[200px] sm:max-w-md" id="moduleTitle">
            Location Detection & Geofence Baseline
          </span>
        </div>
        <span class="text-slate-400 font-bold text-[11px]" id="progressPercent">5% Completed</span>
      </div>

      <!-- Progress Fill Track -->
      <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden p-0.5 border border-slate-700/60">
        <div id="progressBarFill" class="bg-gradient-to-r from-sky-500 via-teal-400 to-emerald-400 h-full rounded-full transition-all duration-300" style="width: 5.5%;"></div>
      </div>

      <!-- Playback Controls -->
      <div class="flex items-center justify-between flex-wrap gap-2 pt-1">
        <div class="flex items-center space-x-1.5">
          <!-- Play / Pause -->
          <button id="playPauseBtn" onclick="togglePlayPause()" class="px-3 py-1.5 rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-bold text-xs flex items-center space-x-1.5 transition-all shadow-sm cursor-pointer active:scale-95">
            <i data-lucide="pause" id="playPauseIcon" class="w-3.5 h-3.5"></i>
            <span id="playPauseText">Pause</span>
          </button>

          <!-- Speed Multiplier 1x / 2x / 4x -->
          <button id="speedBtn" onclick="cycleSpeed()" class="px-2.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-amber-400 font-bold text-xs border border-slate-700 flex items-center space-x-1 transition-all cursor-pointer">
            <i data-lucide="zap" class="w-3.5 h-3.5"></i>
            <span id="speedText">1× Speed</span>
          </button>

          <!-- Previous Module -->
          <button onclick="previousModule()" class="p-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition-all cursor-pointer" title="Previous Module" id="prevBtnTooltip">
            <i data-lucide="skip-back" class="w-4 h-4"></i>
          </button>

          <!-- Next / Skip Module -->
          <button onclick="nextModule()" class="px-2.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 font-bold text-xs flex items-center space-x-1 transition-all cursor-pointer" title="Next Module">
            <span id="skipBtnText">Skip</span>
            <i data-lucide="skip-forward" class="w-3.5 h-3.5"></i>
          </button>

          <!-- Restart -->
          <button onclick="restartSimulation()" class="p-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition-all cursor-pointer" title="Restart to Module 1" id="restartBtnTooltip">
            <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
          </button>
        </div>

        <div class="flex items-center space-x-2">
          <!-- Module Quick Jumper Menu -->
          <button onclick="toggleModuleDrawer()" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-bold text-xs flex items-center space-x-1.5 transition-all cursor-pointer">
            <i data-lucide="list" class="w-3.5 h-3.5 text-sky-400"></i>
            <span id="allModulesBtnText">All 18 Modules</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ============================================================================ -->
  <!-- 3. MAIN SIMULATION CANVAS AREA -->
  <!-- ============================================================================ -->
  <main class="flex-1 max-w-5xl w-full mx-auto p-3 sm:p-5 space-y-4">
    <!-- Active Module Render Container -->
    <div id="moduleContentCanvas" class="w-full">
      <!-- Injected via JavaScript -->
    </div>
  </main>

  <!-- ============================================================================ -->
  <!-- 4. ALL 18 MODULES JUMPER DRAWER / MODAL -->
  <!-- ============================================================================ -->
  <div id="moduleDrawerModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-700 rounded-3xl max-w-2xl w-full max-h-[85vh] flex flex-col overflow-hidden shadow-2xl animate-fadeIn">
      <div class="p-4 border-b border-slate-800 flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <i data-lucide="layers" class="w-5 h-5 text-sky-400"></i>
          <h3 id="drawerModalTitle" class="font-display font-bold text-base text-white">Select Any of 18 Simulation Modules</h3>
        </div>
        <button onclick="toggleModuleDrawer()" class="p-1.5 rounded-xl text-slate-400 hover:text-white bg-slate-800 cursor-pointer">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <div class="p-4 overflow-y-auto grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs" id="drawerModulesList">
        <!-- Rendered via JS -->
      </div>
    </div>
  </div>

  <!-- ============================================================================ -->
  <!-- 5. IN-APP NOTIFICATION TOAST OVERLAY -->
  <!-- ============================================================================ -->
  <div id="notificationToastContainer" class="fixed top-20 right-4 z-50 space-y-2 pointer-events-none"></div>

          highTone = !highTone;
          gain.gain.setValueAtTime(0.35, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.35);
        }, 380);
      } catch (e) {}
    }

    function stopSirenAlarm() {
      if (sirenInterval) {
        clearInterval(sirenInterval);
        sirenInterval = null;
      }
    }

    // ============================================================================
    // DUAL-PIPELINE MULTILINGUAL VOICE ENGINE (Guarantees Tamil, Hindi, English audio)
    // ============================================================================
    let cachedVoices = [];
    function loadAvailableVoices() {
      if ('speechSynthesis' in window) {
        cachedVoices = window.speechSynthesis.getVoices() || [];
      }
    }
    if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
      loadAvailableVoices();
      window.speechSynthesis.onvoiceschanged = loadAvailableVoices;
    }

    function playStreamingTTSAudio(text, lang) {
      try {
        const encoded = encodeURIComponent(text.slice(0, 180));
        const primaryUrl = `/api/tts?lang=${lang}&text=${encoded}`;
        const audio = new Audio(primaryUrl);
        currentSimAudio = audio;

        audio.onerror = () => {
          // Direct fallback
          const fallbackUrl = `https://translate.google.com/translate_tts?ie=UTF-8&tl=${lang}&client=tw-ob&q=${encoded}`;
          const altAudio = new Audio(fallbackUrl);
          currentSimAudio = altAudio;
          altAudio.play().catch(console.warn);
        };

        const playPromise = audio.play();
        if (playPromise !== undefined) {
          playPromise.catch(e => {
            const fallbackUrl = `https://translate.google.com/translate_tts?ie=UTF-8&tl=${lang}&client=tw-ob&q=${encoded}`;
            const altAudio = new Audio(fallbackUrl);
            currentSimAudio = altAudio;
            altAudio.play().catch(console.warn);
          });
        }
      } catch (err) {
        console.warn('Streaming TTS error:', err);
      }
    }

    function speakSimulationText(text, lang = currentLang) {
      if (!soundEnabled || !text) return;

      const targetLang = (lang || currentLang || 'en').toLowerCase().split(/[-_]/)[0];
      const cleanText = text.replace(/<[^>]*>/g, '').trim();

      // Stop any existing audio element or speech synthesis
      if (currentSimAudio) {
        try {
          currentSimAudio.pause();
          currentSimAudio.currentTime = 0;
        } catch (e) {}
        currentSimAudio = null;
      }
      if ('speechSynthesis' in window) {
        try {
          window.speechSynthesis.cancel();
        } catch (e) {}
      }

      // 1. FOR TAMIL (ta): Always use high-fidelity neural streaming audio
      // Windows/Chrome does not have an offline SAPI Tamil voice installed
      if (targetLang === 'ta') {
        playStreamingTTSAudio(cleanText, 'ta');
        return;
      }

      // 2. FOR HINDI & ENGLISH: Use Web Speech API if local voice exists, else stream
      if ('speechSynthesis' in window) {
        try {
          if (cachedVoices.length === 0) loadAvailableVoices();
          const matchedVoice = cachedVoices.find(v => {
            const vLang = (v.lang || '').toLowerCase().replace('_', '-');
            const vName = (v.name || '').toLowerCase();
            if (targetLang === 'hi') return vLang.startsWith('hi') || vName.includes('hindi') || vName.includes('kalpana') || vName.includes('swara');
            return vLang.startsWith('en-in') || vLang.startsWith('en-us') || vLang.startsWith('en');
          });

          if (matchedVoice) {
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.rate = 1.0;
            utterance.pitch = 1.05;
            utterance.lang = targetLang === 'hi' ? 'hi-IN' : 'en-US';
            utterance.voice = matchedVoice;
            utterance.onerror = () => {
              playStreamingTTSAudio(cleanText, targetLang);
            };
            window.speechSynthesis.speak(utterance);
            return;
          }
        } catch (e) {
          console.warn('SpeechSynthesis error:', e);
        }
      }

      // 3. Fallback streaming audio
      playStreamingTTSAudio(cleanText, targetLang);
    }

      if (!isPaused) {
        scheduleNextStep();

    function cycleSpeed() {
      const t = UI_I18N[currentLang] || UI_I18N.en;
      if (playbackSpeed === 1) playbackSpeed = 2;
      else if (playbackSpeed === 2) playbackSpeed = 4;
      else playbackSpeed = 1;
      document.getElementById('speedText').innerText = t.speed(playbackSpeed);
      if (!isPaused) {
        clearTimeout(stepTimer);

      }

      soundEnabled = !soundEnabled;
      const t = UI_I18N[currentLang] || UI_I18N.en;
      document.getElementById('soundStatusText').innerText = soundEnabled ? t.soundOn : t.soundMuted;
      const icon = document.getElementById('soundIcon');
      if (icon) icon.setAttribute('data-lucide', soundEnabled ? 'volume-2' : 'volume-x');
      lucide.createIcons();

        stopSirenAlarm();
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        if (currentSimAudio) { currentSimAudio.pause(); currentSimAudio = null; }

    function nextModule() {
      clearTimeout(stepTimer);
      stopSirenAlarm();
      if (currentSimAudio) { currentSimAudio.pause(); currentSimAudio = null; }
      if (currentModuleIndex < TOTAL_MODULES) {
        currentModuleIndex++;
      } else {
        currentModuleIndex = 1;
      }
      playSynthesizedChime();
      renderCurrentModule();
      if (!isPaused) scheduleNextStep();
    }

    function previousModule() {
      clearTimeout(stepTimer);
      stopSirenAlarm();
      if (currentSimAudio) { currentSimAudio.pause(); currentSimAudio = null; }
      if (currentModuleIndex > 1) {
        currentModuleIndex--;
      } else {
        currentModuleIndex = TOTAL_MODULES;
      }
      playSynthesizedChime();
      renderCurrentModule();
      if (!isPaused) scheduleNextStep();
    }

    function jumpToModule(idx) {
      clearTimeout(stepTimer);
      stopSirenAlarm();
      if (currentSimAudio) { currentSimAudio.pause(); currentSimAudio = null; }
      currentModuleIndex = idx;
      playSynthesizedChime();
      toggleModuleDrawer();
      renderCurrentModule();
      if (!isPaused) scheduleNextStep();
    }

    function restartSimulation() {
      clearTimeout(stepTimer);
      stopSirenAlarm();
      if (currentSimAudio) { currentSimAudio.pause(); currentSimAudio = null; }
      currentModuleIndex = 1;
      playSynthesizedChime();
      renderCurrentModule();
      if (!isPaused) scheduleNextStep();
    }

    function toggleModuleDrawer() {
      const modal = document.getElementById('moduleDrawerModal');
      modal.classList.toggle('hidden');
      if (!modal.classList.contains('hidden')) {
        renderDrawerList();

    function renderDrawerList() {
      const container = document.getElementById('drawerModulesList');
      const titles = MODULE_TITLES[currentLang] || MODULE_TITLES.en;
      container.innerHTML = titles.map((name, i) => `

        </button>
      `).join('');
    }

    function scheduleNextStep() {
      clearTimeout(stepTimer);
      if (isPaused) return;

      const baseDurationMs = (currentModuleIndex === 3 || currentModuleIndex === 4 || currentModuleIndex === 7 || currentModuleIndex === 17 || currentModuleIndex === 18) ? 7500 : 5000;
      const effectiveDuration = Math.max(1200, Math.round(baseDurationMs / playbackSpeed));

      stepTimer = setTimeout(() => {
        if (!isPaused) {
          if (currentModuleIndex < TOTAL_MODULES) {
            nextModule();
          } else {
            currentModuleIndex = 1;
            renderCurrentModule();
            scheduleNextStep();
          }
        }
      }, effectiveDuration);
    }
